<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — Sedrick Bosomi Emeka</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: "Inter", sans-serif;
    background: linear-gradient(160deg, #0a1830 0%, #0d2140 45%, #123157 100%);
    color: rgba(255,255,255,0.85);
    padding: 24px;
  }
  .wrap { max-width: 480px; }
  .code {
    font-family: "Sora", sans-serif;
    font-weight: 800;
    font-size: clamp(3.5rem, 10vw, 5.5rem);
    background: linear-gradient(120deg, #ffffff 35%, #c9d9f5 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1;
    margin-bottom: 12px;
  }
  h1 {
    font-family: "Sora", sans-serif;
    font-weight: 700;
    font-size: 1.4rem;
    color: #fff;
    margin-bottom: 12px;
  }
  p { margin-bottom: 28px; color: rgba(255,255,255,0.6); }
  a.btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 28px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.95rem;
    color: #fff;
    background: linear-gradient(135deg, #ff7a3d, #f9622a);
    box-shadow: 0 10px 24px rgba(249, 98, 42, 0.32);
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Cette page n'existe pas</h1>
    <p>Le lien que vous avez suivi est peut-être incorrect ou la page a été déplacée.</p>
    <a class="btn" href="/">Retour à l'accueil</a>
  </div>
</body>
</html>
